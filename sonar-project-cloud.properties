# SonarCloud project; deliberately separate from sonar-project.properties (local MiProyecto).
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.host.url=https://sonarcloud.io
sonar.organization=4dr1-2529
sonar.projectKey=4dr1-2529_taller1
sonar.projectName=BLENKIR

# Keep analysis scope aligned with the maintained application and operational code.
sonar.sources=backend/src,backend/scripts,frontend/src,machine-learning/app,machine-learning/train.py,machine-learning/utils
sonar.tests=backend/tests,frontend/tests,machine-learning/tests

sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/.next/**,\
**/coverage/**

# Do not suppress secret detection in source, scripts, docs, or migrations.
sonar.text.exclusions=\
**/node_modules/**,\
**/.next/**,\
**/dist/**,\
**/coverage/**,\
**/tmp/**,\
**/.git/**

sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info,coverage/backend/lcov.info
sonar.python.coverage.reportPaths=machine-learning/coverage.xml

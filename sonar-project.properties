# SonarQube local — Tesis Dashboard
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Código de aplicación y utilidades operativas activas. Los scripts bajo backend/scripts
# también contienen lógica de importación, validación y recuperación que debe auditarse.
sonar.sources=backend/src,backend/scripts,frontend/src,machine-learning/app,machine-learning/train.py,machine-learning/utils
sonar.tests=backend/tests,frontend/tests,machine-learning/tests

sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/.next/**,\
**/coverage/**

# El sensor de secretos no excluye scripts, documentación ni migraciones.
sonar.text.exclusions=\
**/node_modules/**,\
**/.next/**,\
**/dist/**,\
**/coverage/**,\
**/tmp/**,\
**/.git/**
sonar.host.url=http://localhost:9000
sonar.projectKey=MiProyecto
sonar.projectName=MiProyecto	
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info,coverage/backend/lcov.info
sonar.python.coverage.reportPaths=machine-learning/coverage.xml

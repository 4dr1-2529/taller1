name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:backend
      - run: pip install -r machine-learning/requirements.txt
      - run: npm run ml:test
      - run: npm run build
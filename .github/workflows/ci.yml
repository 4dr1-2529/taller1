name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: blenkir_refactor_test
        ports:
          - 33316:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run type-check:tools --workspace=backend
      - run: npm run build --workspace=@tesis/shared
      - run: npm run type-check
      - run: npm run lint
      - name: Test backend
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://root:ci-test-password@127.0.0.1:33316/blenkir_refactor_test
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          npm run test:backend
      - name: Apply MySQL migrations
        env:
          DATABASE_URL: mysql://root:ci-test-password@127.0.0.1:33316/blenkir_refactor_test
        run: npm run prisma:migrate:deploy
      - name: Test MySQL integrations
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://root:ci-test-password@127.0.0.1:33316/blenkir_refactor_test
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export S5_ROT_PWD1="$(openssl rand -hex 16)Aa1!"
          export S5_ROT_PWD2="$(openssl rand -hex 16)Bb2!"
          export S5_ROT_PWD3="$(openssl rand -hex 16)Cc3!"
          npm run test:integration --workspace=backend
          npm run test:integration:roles --workspace=backend
          npm run test:integration:ratelimit --workspace=backend
          npm run test:integration:refresh --workspace=backend
      - name: Test frontend
        run: npm run test --workspace=frontend
      - run: >-
          python -m pip install --only-binary=:all: --require-hashes -r machine-learning/requirements.lock
      - run: npm run ml:test
      - run: npm run build
